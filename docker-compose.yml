services:
  db:
    image: postgres:16-alpine
    container_name: venvios-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: venvios
      POSTGRES_PASSWORD: venvios
      POSTGRES_DB: venvios
    ports:
      - "5432:5432"
    volumes:
      - venvios_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venvios -d venvios"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  venvios_pgdata:
